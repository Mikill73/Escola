<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Loader</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #feedback {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: #222;
    color: #fff;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #feedback.show {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="feedback">Tampermonkey aberto!</div>

<script>
  const CODIGO = `(function() {
    'use strict';

    const KEY = 'cfg_mod_js';
    const ID = 'mod_js_hud';

    const NOMES_UI = {
        titulo: 'MOD',
        placeholder: 'Cole o codigo aqui...',
        salvar: 'Salvar',
        ok: 'Salvo',
        erro: 'Erro'
    };

    const _GM_setValue = GM_setValue;
    const _GM_getValue = GM_getValue;
    const _GM_deleteValue = typeof GM_deleteValue !== 'undefined' ? GM_deleteValue : null;
    const _GM_listValues = typeof GM_listValues !== 'undefined' ? GM_listValues : null;
    const _GM_xmlhttpRequest = typeof GM_xmlhttpRequest !== 'undefined' ? GM_xmlhttpRequest : null;
    const _GM_notification = typeof GM_notification !== 'undefined' ? GM_notification : null;
    const _GM_addStyle = typeof GM_addStyle !== 'undefined' ? GM_addStyle : null;
    const _GM_log = typeof GM_log !== 'undefined' ? GM_log : null;

    function injetarAPIsGM() {
        const target = typeof unsafeWindow !== 'undefined' ? unsafeWindow : window;

        if (target.__gm_injetado__) return;
        target.__gm_injetado__ = true;

        target.GM_setValue = function(key, value) {
            try {
                _GM_setValue(key, value);
                return true;
            } catch (e) {
                console.error('[GM] GM_setValue erro:', e);
                return false;
            }
        };

        target.GM_getValue = function(key, defaultValue) {
            try {
                return _GM_getValue(key, defaultValue);
            } catch (e) {
                console.error('[GM] GM_getValue erro:', e);
                return defaultValue;
            }
        };

        if (_GM_deleteValue) {
            target.GM_deleteValue = function(key) {
                try {
                    _GM_deleteValue(key);
                    return true;
                } catch (e) {
                    console.error('[GM] GM_deleteValue erro:', e);
                    return false;
                }
            };
        }

        if (_GM_listValues) {
            target.GM_listValues = function() {
                try {
                    return _GM_listValues();
                } catch (e) {
                    console.error('[GM] GM_listValues erro:', e);
                    return [];
                }
            };
        }

        if (_GM_xmlhttpRequest) {
            target.GM_xmlhttpRequest = function(details) {
                try {
                    return _GM_xmlhttpRequest(details);
                } catch (e) {
                    console.error('[GM] GM_xmlhttpRequest erro:', e);
                    if (details && details.onerror) {
                        details.onerror(e);
                    }
                    return null;
                }
            };
        }

        if (_GM_notification) {
            target.GM_notification = function(details) {
                try {
                    return _GM_notification(details);
                } catch (e) {
                    console.error('[GM] GM_notification erro:', e);
                }
            };
        }

        if (_GM_addStyle) {
            target.GM_addStyle = function(css) {
                try {
                    return _GM_addStyle(css);
                } catch (e) {
                    console.error('[GM] GM_addStyle erro:', e);
                }
            };
        }

        if (_GM_log) {
            target.GM_log = function(msg) {
                try {
                    return _GM_log(msg);
                } catch (e) {
                    console.log('[GM_log]', msg);
                }
            };
        }

        console.log('[MOD] APIs GM injetadas no window da página');
    }

    injetarAPIsGM();

    function salvar(valor) {
        try {
            _GM_setValue(KEY, valor);
            return true;
        } catch (e) {
            return false;
        }
    }

    function ler() {
        try {
            return _GM_getValue(KEY, '') || '';
        } catch (e) {
            return '';
        }
    }

    function executar(valor) {
        if (!valor) return;
        try {
            injetarAPIsGM();
            (0, eval)(valor);
        } catch (e) {
            console.error('[MOD] Erro ao executar código:', e);
        }
    }

    function abrirHud() {
        if (document.getElementById(ID)) return;

        const atual = ler();

        const wrap = document.createElement('div');
        wrap.id = ID;
        wrap.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:2147483647;width:400px;max-height:70vh;background:#1e1e1e;color:#d4d4d4;border:1px solid #444;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5);font-family:monospace;font-size:12px;display:flex;flex-direction:column;overflow:hidden';

        const head = document.createElement('div');
        head.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#2d2d2d;border-bottom:1px solid #444;user-select:none;cursor:move';

        const titulo = document.createElement('span');
        titulo.textContent = NOMES_UI.titulo;
        titulo.style.cssText = 'font-weight:bold;color:#4ec9b0;';
        head.appendChild(titulo);

        const botoes = document.createElement('div');
        botoes.style.cssText = 'display:flex;gap:6px;';

        const bSalvar = document.createElement('button');
        bSalvar.textContent = NOMES_UI.salvar;
        bSalvar.style.cssText = 'padding:4px 10px;background:#0e639c;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;';

        const bExecutar = document.createElement('button');
        bExecutar.textContent = 'Executar';
        bExecutar.style.cssText = 'padding:4px 10px;background:#16825d;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;';

        const bFechar = document.createElement('button');
        bFechar.textContent = 'X';
        bFechar.style.cssText = 'padding:4px 8px;background:#a1260d;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;';

        botoes.appendChild(bSalvar);
        botoes.appendChild(bExecutar);
        botoes.appendChild(bFechar);
        head.appendChild(botoes);
        wrap.appendChild(head);

        const ta = document.createElement('textarea');
        ta.value = atual;
        ta.placeholder = NOMES_UI.placeholder;
        ta.style.cssText = 'flex:1;min-height:280px;max-height:60vh;background:#1e1e1e;color:#d4d4d4;border:none;outline:none;padding:10px;font-family:monospace;font-size:12px;resize:vertical;box-sizing:border-box';
        wrap.appendChild(ta);

        const st = document.createElement('div');
        st.style.cssText = 'padding:6px 10px;background:#252526;color:#808080;font-size:11px;border-top:1px solid #444;';
        st.textContent = '';
        wrap.appendChild(st);

        bSalvar.addEventListener('click', function() {
            const v = ta.value;
            if (salvar(v)) {
                st.textContent = NOMES_UI.ok + ' (' + v.length + ')';
                st.style.color = '#4ec9b0';
            } else {
                st.textContent = NOMES_UI.erro;
                st.style.color = '#f48771';
            }
        });

        bExecutar.addEventListener('click', function() {
            const v = ta.value;
            if (salvar(v)) {
                st.textContent = 'Executando...';
                st.style.color = '#4ec9b0';
                setTimeout(function() {
                    executar(v);
                    st.textContent = 'Executado!';
                }, 100);
            }
        });

        bFechar.addEventListener('click', function() {
            wrap.remove();
        });

        let drag = false, ox = 0, oy = 0;
        head.addEventListener('mousedown', function(e) {
            drag = true;
            const r = wrap.getBoundingClientRect();
            ox = e.clientX - r.left;
            oy = e.clientY - r.top;
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!drag) return;
            wrap.style.left = (e.clientX - ox) + 'px';
            wrap.style.top = (e.clientY - oy) + 'px';
            wrap.style.right = 'auto';
            wrap.style.bottom = 'auto';
        });
        document.addEventListener('mouseup', function() { drag = false; });

        ta.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                bSalvar.click();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                bExecutar.click();
            }
        });

        document.body.appendChild(wrap);
        ta.focus();
    }

    try {
        if (typeof unsafeWindow !== 'undefined') {
            unsafeWindow.iniciar = abrirHud;
            unsafeWindow.executarMod = executar;
        } else {
            window.iniciar = abrirHud;
            window.executarMod = executar;
        }
    } catch (e) {}

    executar(ler());
})();`;

  const CABECALHO = `// ==UserScript==
// @name         New Userscript
// @namespace    http://tampermonkey.net/
// @version      ${new Date().toISOString().slice(0,10)}
// @description  try to take over the world!
// @author       You
// @match        https://*/*
// @icon         data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==
// @grant        GM_setValue
// @grant        GM_getValue
// @grant        GM_xmlhttpRequest
// @grant        GM_deleteValue
// @grant        GM_listValues
// @grant        unsafeWindow
// @connect      discord.com
// ==/UserScript==

`;

  const ARQUIVO_COMPLETO = CABECALHO + CODIGO;

  const feedback = document.getElementById('feedback');

  function instalar() {
    const blob = new Blob([ARQUIVO_COMPLETO], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'New-Userscript.user.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(function() { URL.revokeObjectURL(url); }, 3000);

    feedback.textContent = 'Baixado';
    feedback.classList.add('show');
    setTimeout(function() { feedback.classList.remove('show'); }, 2500);
  }

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      instalar();
    }
  });
</script>

</body>
</html>
